<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR虚拟超市认知评估系统 (VR-CogCart)</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #1abc9c;
            --bg: #ecf0f1;
            --danger: #e74c3c;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            color: var(--primary);
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: var(--accent);
            border-bottom: 2px solid var(--bg);
            padding-bottom: 15px;
        }
        .info-box {
            background: #fdf2e9;
            padding: 15px;
            border-left: 5px solid #f39c12;
            margin: 20px 0;
            border-radius: 4px;
            font-size: 14px;
        }
        .game-area {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        .panel {
            flex: 1;
            border: 2px solid var(--bg);
            padding: 15px;
            border-radius: 8px;
        }
        .item-list li {
            margin-bottom: 10px;
            font-size: 18px;
            cursor: pointer;
            list-style: none;
        }
        .item-list li.done {
            text-decoration: line-through;
            color: #95a5a6;
        }
        .shelf {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .product {
            background: var(--bg);
            padding: 15px;
            text-align: center;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
        }
        .product:hover {
            background: #bdc3c7;
        }
        .product.correct {
            background: var(--accent);
            color: white;
        }
        .product.wrong {
            background: var(--danger);
            color: white;
        }
        .event-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #f39c12;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
        .stats {
            margin-top: 20px;
            padding: 15px;
            background: #34495e;
            color: white;
            border-radius: 8px;
            display: none;
        }
        .start-btn {
            display: block;
            width: 200px;
            margin: 20px auto;
            padding: 15px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>VR虚拟超市认知评估 (VR-CogCart)</h1>
        <div class="info-box">
            <strong>评估维度：</strong>执行功能 + 工作记忆 + 前瞻性记忆<br>
            <strong>操作说明：</strong>点击下方“开始购物”，记住清单并依次点击货架对应物品。途中会触发“店员干扰（前瞻性记忆：经过奶区需取牛奶）”，系统将自动记录轨迹与错误率。
        </div>

        <button class="start-btn" onclick="startGame()">开始购物任务</button>

        <div class="game-area" id="gameArea" style="display:none;">
            <div class="panel">
                <h3>🛒 动态购物清单 (工作记忆)</h3>
                <ul class="item-list" id="list">
                    <li id="item-apple">🍎 红苹果</li>
                    <li id="item-bread">🍞 全麦面包</li>
                    <li id="item-milk" style="color:#f39c12;font-weight:bold;">🥛 [前瞻任务] 经过奶区取牛奶</li>
                </ul>
                <button class="event-btn" id="npcEvent" style="display:none;" onclick="handleNPC()">👩🔧 店员问路干扰！(点击应对)</button>
            </div>
            
            <div class="panel">
                <h3>🏪 虚拟货架</h3>
                <div class="shelf">
                    <div class="product" onclick="pick('apple')">🍎 红苹果</div>
                    <div class="product" onclick="pick('milk')">🥛 牛奶</div>
                    <div class="product" onclick="pick('bread')">🍞 面包</div>
                    <div class="product" onclick="pick('banana')">🍌 香蕉(干扰项)</div>
                </div>
            </div>
        </div>

        <div class="stats" id="stats">
            <h3>📊 认知轨迹自动评分</h3>
            <p>完成时间: <span id="time"></span> 秒</p >
            <p>工作记忆错误: <span id="errors"></span> 次</p >
            <p>前瞻性记忆触发: <span id="prospect"></span></p >
            <p>抗干扰指数: <span id="focus"></span></p >
        </div>
    </div>

    <script>
        let startTime, errors = 0, prospectDone = false, npcTriggered = false;
        
        function startGame() {
            document.querySelector('.start-btn').style.display = 'none';
            document.getElementById('gameArea').style.display = 'flex';
            startTime = Date.now();
            setTimeout(() => {
                document.getElementById('npcEvent').style.display = 'block';
                npcTriggered = true;
            }, 3000);
        }

        function pick(item) {
            if(!startTime) return;
            if(item === 'apple') {
                document.getElementById('item-apple').classList.add('done');
                event.target.classList.add('correct');
            } else if(item === 'bread') {
                document.getElementById('item-bread').classList.add('done');
                event.target.classList.add('correct');
            } else if(item === 'milk') {
                prospectDone = true;
                document.getElementById('item-milk').classList.add('done');
                event.target.classList.add('correct');
            } else {
                errors++;
                event.target.classList.add('wrong');
            }
            
            if(document.querySelectorAll('.item-list li.done').length === 3) {
                endGame();
            }
        }

        function handleNPC() {
            document.getElementById('npcEvent').style.display = 'none';
            // 应对干扰后继续任务
        }

        function endGame() {
            let timeTaken = ((Date.now() - startTime)/1000).toFixed(1);
            document.getElementById('time').innerText = timeTaken;
            document.getElementById('errors').innerText = errors;
            document.getElementById('prospect').innerText = prospectDone ? "成功触发(抗干扰强)" : "未触发(前瞻性记忆缺失)";
            document.getElementById('focus').innerText = errors === 0 && prospectDone ? "优秀" : (errors < 2 ? "中等" : "需干预");
            document.getElementById('stats').style.display = 'block';
        }
    </script>
</body>
</html>
